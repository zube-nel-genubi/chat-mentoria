<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075E54">

    <title>Atendimento</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #efeae2;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /*
         * Oculta a bolha do Chatwoot.
         */
        .woot-widget-bubble {
            display: none !important;
        }
    </style>
</head>

<body>

<script>

    /*
     * Configurações do Chatwoot
     */
    window.chatwootSettings = {
        hideMessageBubble: true,
        position: "right",
        locale: "pt_BR",
        useBrowserLanguage: false,
        type: "standard",
        darkMode: "light",

        welcomeTitle: "Atendimento",
        welcomeDescription: "Olá! Como podemos ajudar?",
        availableMessage: "Estamos online e prontos para atender.",
        unavailableMessage: "No momento estamos offline.",

        enableFileUpload: true,
        enableEmojiPicker: true,
        enableEndConversation: true
    };


    /*
     * Quando o Chatwoot estiver pronto,
     * abre automaticamente o chat.
     */
    window.addEventListener("chatwoot:ready", function () {

        if (window.$chatwoot) {

            window.$chatwoot.toggleBubbleVisibility("hide");

            setTimeout(function () {
                window.$chatwoot.toggle("open");
            }, 300);

        }

    });


    /*
     * Carrega o Chatwoot.
     */
    (function (d, t) {

        var BASE_URL =
            "https://n8n-chatwoot.plbdc.easypanel.host";

        var g = d.createElement(t);
        var s = d.getElementsByTagName(t)[0];

        g.src = BASE_URL + "/packs/js/sdk.js";

        g.defer = true;
        g.async = true;

        s.parentNode.insertBefore(g, s);

        g.onload = function () {

            window.chatwootSDK.run({
                websiteToken: "gLupGDTwDscDZfXhFDtsCVR",
                baseUrl: BASE_URL
            });

        };

    })(document, "script");

</script>

</body>
</html>
