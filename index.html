<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#075E54">

    <title>Atendimento</title>

    <style>
        /* =========================================================
           PÁGINA
        ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #efeae2;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================================
           CHATWOOT EM TELA INTEIRA
        ========================================================= */

        .woot-widget-holder {
            position: fixed !important;

            top: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;

            width: 100vw !important;
            height: 100vh !important;

            max-width: none !important;
            max-height: none !important;

            margin: 0 !important;
            padding: 0 !important;

            border-radius: 0 !important;
            box-shadow: none !important;

            transform: none !important;
        }

        .woot-widget-holder iframe {
            width: 100% !important;
            height: 100% !important;

            max-width: none !important;
            max-height: none !important;

            border: 0 !important;
            border-radius: 0 !important;
        }

        /* Esconde a bolha */
        .woot-widget-bubble {
            display: none !important;
        }

        /* =========================================================
           COMPATIBILIDADE MOBILE
        ========================================================= */

        @media (max-width: 768px) {

            .woot-widget-holder {
                width: 100vw !important;
                height: 100dvh !important;

                top: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
            }

            .woot-widget-holder iframe {
                width: 100vw !important;
                height: 100dvh !important;
            }
        }
    </style>
</head>

<body>

<script>

(function(d, t) {

    var BASE_URL =
        "https://n8n-chatwoot.pldbce.easypanel.host";

    var g = d.createElement(t);
    var s = d.getElementsByTagName(t)[0];

    g.src = BASE_URL + "/packs/js/sdk.js";

    g.async = true;
    g.defer = true;

    s.parentNode.insertBefore(g, s);

    g.onload = function() {

        window.chatwootSDK.run({
            websiteToken: "gLupGDTwDscDZfXhFDtsCVR",
            baseUrl: BASE_URL
        });

    };

})(document, "script");


/*
 * Aguarda o Chatwoot terminar de carregar.
 */
window.addEventListener("chatwoot:ready", function() {

    if (window.$chatwoot) {

        /*
         * Abre o atendimento automaticamente.
         */
        window.$chatwoot.toggle("open");

    }

});


/*
 * Segurança adicional:
 * caso o evento ready já tenha ocorrido antes
 * do listener ser registrado.
 */
var chatwootCheck = setInterval(function() {

    if (
        window.$chatwoot &&
        window.$chatwoot.hasLoaded
    ) {

        clearInterval(chatwootCheck);

        window.$chatwoot.toggle("open");

    }

}, 300);

</script>

</body>
</html>
